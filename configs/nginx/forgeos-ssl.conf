# ForgeOS Nginx Configuration
# SSL termination + reverse proxy for all platform services
# TLS certificates managed by Tailscale (Let's Encrypt)

# ── HTTP → HTTPS redirect ──────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ── HTTPS reverse proxy ────────────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # TLS (Tailscale-managed Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/tailscale.crt;
    ssl_certificate_key /etc/nginx/ssl/tailscale.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # ── ForgeOS Dashboard (port 3000) ──────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── VS Code / code-server (port 8443) ──────────────────
    location /vscode/ {
        proxy_pass http://127.0.0.1:8443/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── OmniRoute Dashboard (port 20128) ───────────────────
    location /omniroute/ {
        proxy_pass http://127.0.0.1:20128/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── Trinity Frontend (port 1517) ───────────────────────
    location /trinity/ {
        proxy_pass http://127.0.0.1:1517/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── Terminal (port 8767) ───────────────────────────────
    location /terminal {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header Host $host;
    }

    # ── WebSocket (port 8766) ──────────────────────────────
    location /ws {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── Hermes Agent (port 13133) ──────────────────────────
    location /hermes/ {
        proxy_pass http://127.0.0.1:13133/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── Munder Difflin (port 8420) ─────────────────────────
    location /munder-difflin/ {
        proxy_pass http://127.0.0.1:8420/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ── Station / Workstation (port 8090) ──────────────────
    location /station/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}